name: mybranch_Test_build

on:
  push:
    branches:
      - mybranch

jobs:
  test:
    name: Test on ${{ matrix.os }} and Node.js ${{ matrix.node-version }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-22.04
        node-version:
          - 18
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Nothing
        run: echo "Nothing to do here"

      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev python3-setuptools rsync swig unzip zlib1g-dev file wget

      - name: Build IPK
        run: |
          echo "build ipk"
          wget https://archive.openwrt.org/releases/24.10.0/targets/x86/64/openwrt-imagebuilder-24.10.0-x86-64.Linux-x86_64.tar.zst
          tar --use-compress-program=unzstd -xvf openwrt-imagebuilder-24.10.0-x86-64.Linux-x86_64.tar.zst
          cd openwrt-imagebuilder-24.10.0-x86-64.Linux-x86_64/
          ls