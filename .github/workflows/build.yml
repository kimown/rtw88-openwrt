name: mybranch_Test_build

on:
  push:
    branches:
      - mybranch

jobs:
  test:
    name: Test on ${{ matrix.os }} and Node.js ${{ matrix.node-version }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-22.04
        node-version:
          - 18
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Nothing
        run: echo "Nothing to do here"

      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev python3-setuptools rsync swig unzip zlib1g-dev file wget curl
      
      - name: Download Sdk
        run: |
          wget https://downloads.openwrt.org/releases/24.10.2/targets/x86/64/openwrt-sdk-24.10.2-x86-64_gcc-13.3.0_musl.Linux-x86_64.tar.zst
          tar --use-compress-program=unzstd -xvf openwrt-sdk-24.10.2-x86-64_gcc-13.3.0_musl.Linux-x86_64.tar.zst

      - name: Build IPK
        run: |
          echo "build ipk"
          cd openwrt-sdk-24.10.2-x86-64_gcc-13.3.0_musl.Linux-x86_64/
          ./scripts/feeds update -a 
          ./scripts/feeds install -a
          curl -o .config https://downloads.openwrt.org/releases/24.10.2/targets/x86/64/config.buildinfo
          ls -lh .config
          make defconfig
          ls -lh .config

      - name: Build IPK
        run: |
          cd openwrt-sdk-24.10.2-x86-64_gcc-13.3.0_musl.Linux-x86_64/
          ls
          mkdir -p package/kernel/rtw88/
          git clone -b mybranch https://github.com/kimown/rtw88-openwrt.git package/kernel/rtw88/rtw88-openwrt
          make package/kernel/rtw88/rtw88-openwrt/compile -j1 V=s

      - uses: actions/upload-artifact@v4
        with:
          name: my-artifact
          path: openwrt-sdk-24.10.2-x86-64_gcc-13.3.0_musl.Linux-x86_64/bin
    